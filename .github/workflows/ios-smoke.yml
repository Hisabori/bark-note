name: iOS startup smoke
on:
  workflow_dispatch:
  push:
    branches: [bark-note-unified]
    paths: ['lib/**', 'ios/**', 'pubspec.*', 'tool/ios_startup_smoke.py', 'tool/verify_ios_manifest.py', '.github/workflows/ios-smoke.yml']
permissions:
  contents: read
jobs:
  startup:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate scene metadata
        run: python3 tool/verify_ios_manifest.py
      - name: Prepare model and extension
        run: |
          curl --fail --location --retry 3 'https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/audio_classification/android/lite-model_yamnet_classification_tflite_1.tflite' -o assets/models/yamnet.tflite
          echo '10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de  assets/models/yamnet.tflite' | shasum -a 256 --check
          gem install xcodeproj --no-document --user-install
          ruby tool/add_live_activity.rb
          flutter pub get
      - name: Build simulator app
        run: flutter build ios --simulator --debug --dart-define=STARTUP_SMOKE=true
      - name: Verify two cold launches and first frame
        run: python3 tool/ios_startup_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-startup-evidence
          path: build/startup-smoke
          if-no-files-found: warn
          retention-days: 7
