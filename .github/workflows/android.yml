name: Build Bark Note Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.*'
      - 'assets/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Fetch pinned pretrained model
        run: |
          curl --fail --location --retry 3 'https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/audio_classification/android/lite-model_yamnet_classification_tflite_1.tflite' -o assets/models/yamnet.tflite
          echo '10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de  assets/models/yamnet.tflite' | sha256sum --check
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart tool/check_ai.dart
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Bark-Note-Android-AI
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
