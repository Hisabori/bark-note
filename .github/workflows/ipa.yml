name: Build Bark Note IPA
run-name: Bark Note IPA ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [bark-note-unified]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.*'
      - 'assets/**'
      - 'tool/**'
      - '.github/workflows/ipa.yml'
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Fetch pinned pretrained model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/audio_classification/android/lite-model_yamnet_classification_tflite_1.tflite' -o assets/models/yamnet.tflite
          echo '10c95ea3eb9a7bb4cb8bddf6feb023250381008177ac162ce169694d05c317de  assets/models/yamnet.tflite' | shasum -a 256 --check
      - name: Add Live Activity extension
        run: |
          gem install xcodeproj --no-document --user-install
          ruby tool/add_live_activity.rb
      - name: Typecheck Live Activity views
        run: xcrun --sdk iphoneos swiftc -parse-as-library -typecheck -target arm64-apple-ios16.2 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" ios/LiveActivity/DepartureAttributes.swift ios/LiveActivity/DepartureWidget.swift
      - name: Resolve and verify
        run: |
          flutter --version
          flutter pub get
          flutter analyze
          flutter test
          dart tool/check_analysis.dart
          dart tool/check_ai.dart
      - name: Inject private transit key
        env:
          SEOUL_KEY: ${{ secrets.RAIL_SEOUL_API_KEY }}
          KAKAO_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python3 -c 'import os,json; json.dump({"SEOUL_API_KEY":os.environ.get("SEOUL_KEY", ""), "KAKAO_REST_API_KEY":os.environ.get("KAKAO_KEY", "")},open("build-config.json","w"))'
      - name: Build device app without signing
        run: flutter build ios --release --no-codesign --dart-define-from-file=build-config.json
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          test -f "$APP/Runner"
          test -f "$APP/PlugIns/DepartureWidget.appex/DepartureWidget"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          test -f "$APP/Frameworks/App.framework/flutter_assets/assets/models/yamnet.tflite"
          xcrun nm -gU "$APP/Runner" > build/ios/tflite-symbols.txt
          while IFS= read -r symbol; do
            symbol="${symbol%$'\r'}"
            if ! grep -F " _$symbol" build/ios/tflite-symbols.txt >/dev/null; then
              echo "Missing exported TFLite symbol: $symbol"
              head -50 build/ios/tflite-symbols.txt
              exit 1
            fi
            echo "Verified $symbol"
          done < tool/ios_tflite_symbols.txt
          mkdir -p build/ipa/Payload
          ditto "$APP" build/ipa/Payload/Runner.app
          cd build/ipa
          /usr/bin/zip -qry Bark-Note-Unified-0.6-unsigned.ipa Payload
          /usr/bin/unzip -t Bark-Note-Unified-0.6-unsigned.ipa
          shasum -a 256 Bark-Note-Unified-0.6-unsigned.ipa > SHA256.txt
          printf '%s\n' 'Unsigned device IPA. Re-sign with Sideloadly before installation. This is not an App Store or TestFlight build.' > INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bark-Note-Unified-IPA
          path: |
            build/ipa/Bark-Note-Unified-0.6-unsigned.ipa
            build/ipa/SHA256.txt
            build/ipa/INSTALL.txt
          if-no-files-found: error
          retention-days: 7


