name: Fetch official crowd data
on:
  push:
    branches: [bark-note-unified]
    paths: ['tool/fetch_crowd.py', '.github/workflows/crowd-data.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/fetch_crowd.py

      - uses: actions/upload-artifact@v4
        with:
          name: Official-Crowd-20260630
          path: crowd-artifact/
          if-no-files-found: error
